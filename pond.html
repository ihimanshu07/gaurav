<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>pond — a quiet corner</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">

</head>

        <button class="sq" type="button" data-pond-action="current" aria-label="Toggle the current" title="Toggle the current"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8c3-2 6-2 9 0s6 2 9 0"/><path d="M3 13c3-2 6-2 9 0s6 2 9 0" opacity=".6"/><path d="M3 18c3-2 6-2 9 0s6 2 9 0" opacity=".3"/></svg></button>

    </div>
  </div>
  <a class="home" href="index.html">gauravsingh.info &#8599;</a>
</div>
